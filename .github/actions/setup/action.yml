name: Setup
description: Setup Node.js and install dependencies

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    # No restore-keys on purpose. A prefix fallback restores node_modules from an
    # unrelated lockfile, and yarn's install state file can then treat that stale tree
    # as already correct — which is how example/node_modules ended up without the
    # react-native CLI that settings.gradle shells out to. Only an exact lockfile
    # match may be reused.
    - name: Cache dependencies
      id: yarn-cache
      uses: actions/cache@v6
      with:
        path: |
          **/node_modules
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}

    # Deliberately NOT gated on cache-hit. The cache is a download accelerator, not a
    # substitute for installing: a restored **/node_modules can be stale or partial,
    # which broke the Gradle jobs (settings.gradle shells out to the autolinking CLI
    # and exited 127). With the cache warm this is a fast no-op.
    - name: Install dependencies
      run: yarn install --immutable
      shell: bash
