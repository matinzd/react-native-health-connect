name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage --passWithNoTests

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepack

  # Exercises the Expo autolinking path: android-expo/ must be linked here, and the
  # regular react-native-health-connect project must STILL be linked alongside it.
  expo-prebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # example-expo is its own yarn project rather than a workspace: yarn will not
      # materialise a link:/portal: symlink pointing at an ancestor directory, and
      # Expo autolinking needs a real node_modules entry to discover android-expo/.
      # Its postinstall creates that symlink.
      - name: Install example-expo
        working-directory: example-expo
        run: yarn install --immutable

      - name: Prebuild
        working-directory: example-expo
        run: npx expo prebuild --clean --platform android

      - name: Assert both projects are linked
        working-directory: example-expo
        run: |
          set -eux
          grep -q "react-native-health-connect-expo" android/settings.gradle
          grep -q "react-native-health-connect'" android/settings.gradle
          grep -rq "expo.modules.healthconnect.HealthConnectPackage" \
            android/app/build/generated/expo/ || \
            grep -rq "expo.modules.healthconnect.HealthConnectPackage" android/

      - name: Assemble
        working-directory: example-expo/android
        run: ./gradlew :app:assembleDebug --no-daemon
